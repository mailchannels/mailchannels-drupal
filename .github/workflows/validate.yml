name: Validate candidate
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  isolated-contracts:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3.35', '8.4.26', '8.5.11']
    env:
      DRUPAL_TEST_IMAGE: mailchannels-drupal-tests:php${{ matrix.php }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build PHP environment
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -f .ci/Dockerfile -t "$DRUPAL_TEST_IMAGE" .
      - name: Install locked dependencies without plugins or scripts
        run: docker run --rm -v "$PWD:/app" -w /app/contract "$DRUPAL_TEST_IMAGE" composer install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
      - name: Isolated syntax and contract checks
        run: python .ci/check.py
  native-site:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3.35', '8.4.26', '8.5.11']
    env:
      DRUPAL_TEST_IMAGE: mailchannels-drupal-tests:php${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build PHP environment
        run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -f .ci/Dockerfile -t "$DRUPAL_TEST_IMAGE" .
      - name: Install certificate-fixture dependency
        run: python -m pip install cryptography==45.0.3
      - name: Fresh isolated Drupal and MariaDB fixture
        run: python native/run.py
